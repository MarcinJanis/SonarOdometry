# Sonar configuration
rate: 2.0 # data sampling frequency [Hz]
resolution: 
  beams: 768 # horizontal resolution - number of acustic beams
  bins: 800 # distance (vertical) resolution
fov:
  horizontal: 2.2689 # [rad] 130 deg
  vertical: 0.3490 # [rad] 20 deg
range:
  min: 0 # [m]
  max: 50 # [m]
position:
  x: 0.0 # [m]
  y: 0.0 # [m]
  z: 0.0 # [m]
  roll: 0.0 # [rad]
  pitch: 0.0 # [rad]
  yaw: 0.0 # [rad]


