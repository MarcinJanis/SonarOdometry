# ==============================================================================
# KONFIGURACJA MODELU ODOMETRII SONAROWEJ (2D)
# ==============================================================================

# Wymiary wejściowe dla przetwarzania obrazu
input_dimensions:
  polar_height: 400
  polar_width: 384
  cart_height: 424
  cart_width: 776

# Konfiguracja dopasowania cech (LoFTR) i RANSAC
feature_matching:
  pts_match_thresh: 0.40      # Próg ufności LoFTR (zwiększ przy zbyt dużej liczbie szumu)
  ransac_thresh: 0.25         # Tolerancja reprojekcji w RANSAC [m]
  min_inliers_abs: 12         # Min. liczba punktów do zaakceptowania dopasowania
  min_inliers_ratio: 0.06     # Min. procent inlierów względem wszystkich punktów

# Zarządzanie klatkami kluczowymi (Keyframes)
keyframe_management:
  key_frames_min_dist: 0.5    # Minimalny dystans dla nowej kotwicy [m]
  key_frames_min_rot: 0.15    # Minimalny obrót dla nowej kotwicy [rad]
  max_skip_frames: 4          # Max liczba klatek "ślepych" przed wymuszonym resetem

# Filtracja sygnału sonarowego
filtering:
  use_fls_filter: true        # Włącz filtrację (MedianBlur + CLAHE)
  use_spatial_bucketing: true # Wymuś rozproszenie punktów na siatce
  use_weighted_kabsch: true   # Użyj ważonego algorytmu SVD
  use_range_masking: true     # Wytnij zaszumione krawędzie zasięgu (Range Masking)

# Parametry odzyskiwania śledzenia (gdy model "zgubi" dno)
fallback_logic:
  cvm_decay: 0.9              # Współczynnik zwalniania przy braku dopasowań
  min_confidence: 0.12        # Próg pewności przy dopasowaniu awaryjnym
